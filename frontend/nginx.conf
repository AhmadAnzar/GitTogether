server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the Nginx version in headers or error pages.
  server_tokens off;

  # Security headers. Defined once at server level: any add_header inside a location
  # would silently drop these, so locations below use `expires` instead.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite fingerprints asset filenames, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # index.html must always be revalidated so new deploys show up immediately.
  location / {
    expires -1;
    try_files $uri /index.html;
  }

  # Local Docker Compose and Kubernetes service-to-service API proxy.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:8000/health;
  }
}
