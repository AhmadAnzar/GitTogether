# Traefik ingress controller on kind: exposed as NodePorts 30080/30443 (mapped to host 80/443 by kind).
# helm upgrade --install traefik traefik/traefik --version 41.6.0 -n traefik --create-namespace -f k8s/local/traefik-values.yaml
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    # A NodePort Service has no load balancer address to copy, so Ingresses would show an empty
    # status and ArgoCD would report them as Progressing forever. Publish localhost instead.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
