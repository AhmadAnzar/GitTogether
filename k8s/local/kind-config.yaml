# Local Kubernetes cluster for development: kind create cluster --config k8s/local/kind-config.yaml
# Host ports 80/443 are forwarded to Traefik's NodePorts, so http://gittogether.localhost reaches the Ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gittogether
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80, protocol: TCP }
      - { containerPort: 30443, hostPort: 443, protocol: TCP }
