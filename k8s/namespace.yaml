apiVersion: v1
kind: Namespace
metadata:
  name: gittogether
  labels:
    app.kubernetes.io/part-of: gittogether
    # Pod Security Admission: Kubernetes rejects any pod in this namespace that could run as root,
    # escalate privileges, keep Linux capabilities or skip the seccomp profile ("restricted" level).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
