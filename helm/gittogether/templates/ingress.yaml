{{- if .Values.ingress.enabled }}
{{- $fullname := include "gittogether.fullname" . -}}
# One entry point for the browser: /api goes to the FastAPI backend, everything else to the React
# frontend. /health, /ready and /metrics are not routed, so they stay internal to the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "gittogether.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port: { name: http }
{{- end }}
