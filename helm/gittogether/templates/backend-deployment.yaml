{{- $fullname := include "gittogether.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "gittogether.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "gittogether.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gittogether.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's appuser
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes so one node failing doesn't take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gittogether.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      initContainers:
        # Bring the schema up to date before the API starts. Replicas starting together take turns
        # thanks to a Postgres advisory lock in alembic/env.py. If Postgres isn't up yet, this fails
        # and Kubernetes retries it with backoff.
        - name: migrate
          image: "{{ .Values.backend.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "gittogether.backendEnv" . | nindent 12 }}
          securityContext:
            {{- include "gittogether.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Migrations already ran in the init container, so start the API directly.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          env:
            {{- include "gittogether.backendEnv" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000 }
          # Liveness: is the process alive? (no DB check, so a DB outage doesn't restart every pod)
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          # Readiness: can it serve traffic? /ready returns 503 when the database is unreachable,
          # which takes the pod out of the Service until it recovers.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- include "gittogether.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            # Large uploads (resumes) are spooled to /tmp; the rest of the filesystem is read-only.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
