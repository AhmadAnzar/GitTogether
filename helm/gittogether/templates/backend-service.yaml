apiVersion: v1
kind: Service
metadata:
  name: {{ include "gittogether.fullname" . }}-backend
  labels:
    {{- include "gittogether.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "gittogether.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http # the ServiceMonitor scrapes /metrics on this named port
      port: 8000
      targetPort: http
