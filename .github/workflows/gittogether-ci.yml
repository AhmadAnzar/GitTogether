name: GitTogether CI/CD

# Pipeline:
#   secrets scan + backend lint/test + frontend lint/test/build + terraform checks + config scan
#     -> Docker build -> Trivy image scan (gate) -> push to GHCR
# Images are tagged with the full commit SHA (never `latest`), so every image traces back to one commit.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "demo/**"] # docs and screenshots don't need a rebuild
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "demo/**"]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026.
env:
  TRIVY_VERSION: v0.70.0

jobs:
  # ========================================
  # STAGE 1: quality and security gates (all run in parallel)
  # ========================================
  secrets:
    name: Secret scan - gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Scan git history for committed secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  backend:
    name: Backend - lint & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Test (pytest, fails below 90% coverage)
        run: pytest -v

  frontend:
    name: Frontend - lint, test & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  terraform:
    name: Terraform - fmt & validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.4"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no AWS credentials needed)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  helm:
    name: Helm - lint & validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform

      - name: Lint chart (local and EKS values)
        run: |
          helm lint helm/gittogether -f helm/gittogether/values-kind.yaml
          helm lint helm/gittogether -f helm/gittogether/values-eks.yaml

      - name: Validate rendered manifests against the Kubernetes API schema
        run: |
          for env in kind eks; do
            echo "::group::values-$env"
            helm template gittogether helm/gittogether -n gittogether -f "helm/gittogether/values-$env.yaml" \
              --set monitoring.serviceMonitor.enabled=true \
              | ./kubeconform -strict -summary -skip ServiceMonitor  # CRD schema isn't in the default catalog
            echo "::endgroup::"
          done
          ./kubeconform -strict -summary k8s/namespace.yaml troubleshooting/

  config-scan:
    name: Config scan - Trivy (IaC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to the repo's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Report-only: misconfigurations in Dockerfiles, Helm, K8s manifests and Terraform are
      # published to Security -> Code scanning. Accepted risks are documented in .trivyignore.
      - name: Scan Dockerfiles, Helm, Kubernetes and Terraform
        # Pinned to a commit SHA, not a tag: tags can be moved or deleted (this action's were in 2026).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          skip-dirs: troubleshooting # deliberately broken manifests for the debugging lab
          trivyignores: .trivyignore
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ========================================
  # STAGE 2: build -> scan -> push, once per image
  # ========================================
  images:
    name: Image - ${{ matrix.component }}
    needs: [secrets, backend, frontend, terraform, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry with the built-in GITHUB_TOKEN
      security-events: write # upload image scan results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image name
        # ghcr.io/<owner>/<repo>/<component>: packages created by this repo's workflow are linked to it
        # automatically. Registry paths must be lowercase; GitHub names may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.component }}
          load: true # keep the image locally so Trivy can scan it before anything is pushed
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gittogether-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan image (Trivy, fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Export scan results (all severities) for the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          exit-code: "0"

      - name: Upload image scan to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Pushed \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
